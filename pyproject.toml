[project]
name = "preptalk"
version = "0.1.0"
description = "Apertus and FrameX interview coach for Swiss apprenticeship applicants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aegra-cli>=0.10.7",
    "langchain-core>=0.3.27",
    "langgraph>=1.0.3",
    "pydantic>=2.12.5",
    "framex @ git+https://gitlab.com/ds-unisg/framex-core@dee72c7fdfa4bcefe4eed5abbec8d457dd7f48e6#subdirectory=python",
]

[project.urls]
Repository = "https://github.com/ghwiegand/PrepTalk"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
